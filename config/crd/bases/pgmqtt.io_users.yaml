# The definition the Helm chart installs (deploy/helm/pgmqtt/templates/
# crd-users.yaml), for installs that do not use the chart. Change both:
# internal/operator/crd_test.go fails when they differ.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: users.pgmqtt.io
spec:
  group: pgmqtt.io
  names:
    kind: User
    listKind: UserList
    plural: users
    singular: user
    shortNames:
      - mqu
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Username
          type: string
          jsonPath: .spec.username
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: User configures an MQTT user account managed by pgmqttd. controller-runtime's K8s Lease elects exactly one reconciler at a time across Pods; the elected Pod materialises each User into a row in the broker's Postgres `users` table.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: UserSpec defines the desired state of User.
              type: object
              properties:
                username:
                  description: |
                    MQTT username. Defaults to `metadata.name` when empty.
                    Restricted to `[A-Za-z0-9._-]{1,128}` so a malformed
                    name can't bloat broker storage or push the
                    pg_notify takeover/quota payloads (which carry the
                    username) past Postgres' 8 KB per-NOTIFY hard limit.
                  type: string
                  maxLength: 128
                  pattern: "^[A-Za-z0-9._-]+$"
                passwordSecretRef:
                  description: |
                    References an existing Secret holding the password.
                    Omit to have the reconciler generate a credentials Secret
                    named `<metadata.name>-mqtt-credentials` containing
                    `username`, `password`, `host`, `port`, `ws-port`,
                    `uri`, and `ws-uri` (plus `tls-host`/`tls-port`/
                    `mqtts-uri` when the operator has a TLSHost configured).
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 253
                    key:
                      type: string
                      maxLength: 253
                    optional:
                      type: boolean
                  required:
                    - name
            status:
              description: UserStatus defines the observed state of User.
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
                    required:
                      - type
                      - status
                credentialsSecretRef:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
                observedSecretHash:
                  description: |
                    Deprecated and always empty. Releases before 0.3.0
                    stored a SHA-256 of the password here; the reconciler
                    clears it on its first pass over the User.
                  type: string
                observedSecretVersion:
                  description: |
                    Identity (`<uid>/<resourceVersion>`) of the Secret the
                    password was last read from. While the Secret still
                    has it, the reconciler knows the password is unchanged
                    without comparing it against the stored hash.
                  type: string
                  maxLength: 512
                observedUsername:
                  description: |
                    MQTT username most recently reconciled into the
                    broker's `users` table. The reconciler compares
                    this to the currently-derived username (spec.username
                    or metadata.name) and deletes the old row when they
                    diverge — preventing orphan rows on spec.username
                    rename.
                  type: string
                  maxLength: 128
