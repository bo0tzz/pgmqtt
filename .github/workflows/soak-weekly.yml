name: soak-weekly

# Weekly, Mondays 04:00 UTC. Two independent jobs; either one failing
# fails the run.
#
#   tier3  `scripts/validate.sh tier3`, the same command that is run by
#          hand before a tag: tier 2, then multi-broker Paho conformance,
#          `helm test` and two short soaks against a 3-replica kind
#          cluster. Nothing else in CI runs conformance across brokers.
#   soak   a 60 s QoS 1 soak, then a 30-minute low-rate QoS 0 soak in the
#          shape pgmqtt is deployed in, which is too long for tier 3.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tier3:
    name: tier3 (multi-broker paho + helm test + soak smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - uses: azure/setup-helm@v5
        with:
          version: latest

      - name: install paho deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install paho-mqtt

      - name: clone paho.mqtt.testing
        run: git clone --depth 1 https://github.com/eclipse/paho.mqtt.testing /tmp/paho

      - name: tier3 validate
        # kind, kubectl and kustomize ship on ubuntu-latest. validate.sh
        # creates its own kind cluster, dumps pod state and broker logs
        # if a cluster phase fails, and deletes the cluster on exit.
        run: bash scripts/validate.sh tier3 --paho /tmp/paho

      - name: upload tier3 artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier3-${{ github.run_id }}
          path: |
            /tmp/pgmqttd-validate-*.log
            /tmp/paho-incluster-*.log
            /tmp/soak-incluster-*.json
            /tmp/soak-incluster-*.log
          if-no-files-found: warn
          retention-days: 30

  soak-incluster:
    name: soak (kind + helm + in-cluster pod)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@v5
        with:
          version: latest

      - uses: helm/kind-action@v1
        with:
          cluster_name: pgmqtt-soak
          # Single-node is fine: we test cross-pod fanout via 3 broker
          # replicas, all on this one node.
          wait: 60s

      - name: install postgres
        run: |
          kubectl create namespace mqtt
          kubectl -n mqtt apply -f .github/ci/postgres.yaml
          kubectl -n mqtt rollout status statefulset/postgres --timeout=180s

      - name: build broker image into kind
        run: |
          docker build -t pgmqtt:soak .
          kind load docker-image pgmqtt:soak --name pgmqtt-soak

      - name: helm install (3 replicas, allowAnonymous)
        run: |
          helm install pgmqtt deploy/helm/pgmqtt \
            --namespace mqtt \
            --set image.repository=pgmqtt \
            --set image.tag=soak \
            --set image.pullPolicy=IfNotPresent \
            --set replicaCount=3 \
            --set auth.allowAnonymous=true \
            --set limits.maxQueuedDeliveriesPerClient=0 \
            --set limits.maxConnections=0 \
            --set limits.maxInboundMsgsPerSec=0 \
            --set operator.bcryptCost=4 \
            --set database.url='postgres://pgmqtt:pgmqtt@postgres.mqtt.svc:5432/pgmqtt?sslmode=disable'
          kubectl -n mqtt rollout status deployment/pgmqtt --timeout=180s

      - name: in-cluster soak (60s × 1000 msg/s × QoS 1)
        # The script builds + side-loads the pgmqtt-soak image, runs the
        # Pod, follows logs, and exits non-zero on lost/dups for QoS≥1.
        # This is the bug-class the kubectl port-forward path mis-reported.
        #
        # Rate is back at 1000 msg/s after a brief 500-msg/s stint that
        # was a workaround for a different problem: the rig's fixed-30s
        # drain window. cmd/soak now drains to quiescence, so on a slow
        # CI runner the wall-clock takes longer but the verdict reflects
        # broker correctness, not "broker-vs-the-clock". The lowered rate
        # was treating a symptom; the rig change is the real fix.
        run: |
          bash scripts/soak-incluster.sh \
            --cluster pgmqtt-soak \
            --namespace mqtt \
            --duration 60s \
            --rate 1000 \
            --pubs 3 --subs 3 \
            --inflight 25 \
            --qos 1

      - name: in-cluster soak (30m × 10 msg/s × QoS 0, homelab shape)
        # Mirrors how pgmqtt is actually deployed (HA + Z2M class):
        # long-lived QoS-0 subscribers at low rate. The high-rate QoS-1
        # soak above doesn't surface QoS-0 specific bugs — that gap let
        # the May 2026 zigbee2mqtt-blackhole regression land. At 10 msg/s
        # × 30min × 3 subs each subscriber drains 18000 deliveries, well
        # past MaxQueuedDeliveriesPerClient (10000). Pre-fix the third
        # sub wedges silently; the soak rig reports loss. Post-fix the
        # deliveries table stays near-empty throughout.
        run: |
          bash scripts/soak-incluster.sh \
            --cluster pgmqtt-soak \
            --namespace mqtt \
            --duration 30m \
            --rate 10 \
            --pubs 1 --subs 3 \
            --inflight 1 \
            --qos 0

      - name: collect cluster diagnostics on failure
        if: failure()
        run: |
          echo '=== pods ==='
          kubectl -n mqtt get pods -o wide || true
          echo '=== pgmqtt logs ==='
          kubectl -n mqtt logs -l app.kubernetes.io/name=pgmqtt --tail=500 || true
          echo '=== events ==='
          kubectl -n mqtt get events --sort-by=.lastTimestamp | tail -50 || true

      - name: upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-${{ github.run_id }}
          path: |
            /tmp/soak-incluster-*.json
            /tmp/soak-incluster-*.log
          if-no-files-found: warn
          retention-days: 30
