{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgmqtt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgmqtt.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  podSelector:
    matchLabels:
      {{- include "pgmqtt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: broker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- with .Values.networkPolicy.ingress.from }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- if $.Values.listeners.tcp.enabled }}
        - protocol: TCP
          port: {{ $.Values.listeners.tcp.port }}
        {{- end }}
        {{- if $.Values.listeners.ws.enabled }}
        - protocol: TCP
          port: {{ $.Values.listeners.ws.port }}
        {{- end }}
        {{- if $.Values.metrics.enabled }}
        - protocol: TCP
          port: {{ $.Values.metrics.port }}
        {{- end }}
    {{- else }}
    # No `from` block — empty array would deny all ingress; omit to allow.
    - ports:
        {{- if $.Values.listeners.tcp.enabled }}
        - protocol: TCP
          port: {{ $.Values.listeners.tcp.port }}
        {{- end }}
        {{- if $.Values.listeners.ws.enabled }}
        - protocol: TCP
          port: {{ $.Values.listeners.ws.port }}
        {{- end }}
        {{- if $.Values.metrics.enabled }}
        - protocol: TCP
          port: {{ $.Values.metrics.port }}
        {{- end }}
    {{- end }}
  egress:
    # DNS — required so the pgxpool can resolve the postgres Service host.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres. With no peers configured the rule has no `to`, which allows
    # any destination on the Postgres port: the chart cannot know where the
    # database lives, and leaving the rule out cuts the broker off from it.
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.postgresPort }}
      {{- with .Values.networkPolicy.egress.postgres }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Kubernetes API — required for the User-CRD reconciler (every Pod
    # runs a controller-runtime manager; one wins the K8s Lease and
    # reconciles, all need API access for the Lease + watch).
    #
    # The fallback selects API server pods by label. Most network plugins
    # ignore host-network pods when matching selectors, and the API server
    # usually is one (or is not a pod at all), so on those clusters the
    # fallback matches nothing and networkPolicy.egress.kubernetesAPI has
    # to be set for the operator to work.
    #
    # 6443 is allowed next to 443 because policy is usually enforced after
    # the `kubernetes` Service is translated to the API server's own port.
    - to:
        {{- if .Values.networkPolicy.egress.kubernetesAPI }}
        {{- toYaml .Values.networkPolicy.egress.kubernetesAPI | nindent 8 }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              component: apiserver
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
{{- end }}
