{{- /*
A `helm test` Pod that runs an MQTT round-trip against the deployed chart.
Mirrors .github/ci/smoke-in-cluster.sh. The chart creates no User: host,
port, username and password come from the Secret named by
`tests.credentialsSecret`, which has to exist before `helm test` runs
(the operator generates `<name>-mqtt-credentials` for a User CR `<name>`).

mosquitto_pub/sub only speak MQTT over TCP, so there is nothing to render
when that listener is off.
*/ -}}
{{- if and .Values.tests.enabled .Values.listeners.tcp.enabled }}
{{- $secret := required "tests.credentialsSecret is required when tests.enabled=true" .Values.tests.credentialsSecret }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "pgmqtt.fullname" . }}-test-roundtrip
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgmqtt.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: mosq
      image: {{ .Values.tests.image }}
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          (mosquitto_sub -h "$HOST" -p "$PORT" -u "$U" -P "$P" -t 'helmtest/#' -C 1 -W 15 > /tmp/got 2>&1) &
          SUB=$!
          sleep 1
          mosquitto_pub -h "$HOST" -p "$PORT" -u "$U" -P "$P" -t helmtest/x -m hello -q 1
          wait $SUB
          cat /tmp/got
          grep -q hello /tmp/got
      env:
        - name: HOST
          valueFrom: { secretKeyRef: { name: {{ $secret }}, key: host } }
        - name: PORT
          valueFrom: { secretKeyRef: { name: {{ $secret }}, key: port } }
        - name: U
          valueFrom: { secretKeyRef: { name: {{ $secret }}, key: username } }
        - name: P
          valueFrom: { secretKeyRef: { name: {{ $secret }}, key: password } }
{{- end }}
