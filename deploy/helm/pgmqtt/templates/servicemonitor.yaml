{{- if and .Values.serviceMonitor.enabled .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pgmqtt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgmqtt.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
    {{- $chartLabels := set (include "pgmqtt.labels" . | fromYaml) "app.kubernetes.io/component" "" }}
    {{- range $k, $v := .Values.serviceMonitor.labels }}
    {{- if not (hasKey $chartLabels $k) }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "pgmqtt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: broker
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      path: {{ .Values.serviceMonitor.path }}
{{- end }}
